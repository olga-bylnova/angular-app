<div class="reset-pass-form">
  <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
    <div class="reset-pass-form-header">Reset password</div>
    <div class="reset-pass-form-field">
      <label for="password">Password</label>
      <input id="password" formControlName="password" type="password" placeholder="Password"/>
      <div class="error-message"
           *ngIf="password?.invalid && (password?.dirty || password?.touched)">
        <div *ngIf="password?.errors?.['required']">Password is required.</div>
      </div>
    </div>
    <div class="submit-button">
      <button type="submit" [disabled]="!resetPasswordForm.valid">Reset</button>
    </div>
    <div *ngIf="showSuccessMessage" class="reset-pass-form-success-message">
      <span>Password reset is successful. <br/>You can go back to </span>
      <a [routerLink]="['/auth']">login</a>
    </div>
  </form>
</div>
